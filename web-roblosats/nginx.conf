daemon off;

user nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type  application/octet-stream;
    large_client_header_buffers 4 64K;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;
    error_log   /dev/stderr  warn;

    sendfile        on;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    keepalive_timeout  65;

    server {

        listen 80;
        server_name roblosats_web_client;

        location / {
            root /usr/src/web;
            try_files $uri $uri/ /basic.html;
            index basic.html;
        }

        location /pro {
            root /usr/src/web;
            try_files $uri $uri/ /pro.html;
            index pro.html;
        }

        location /static/ {
            alias /usr/src/web/static/;
            autoindex on;
        }

        location /clearnetonion_verify {
            alias /serve_misc/;
        }

        include /etc/nginx/bridges.conf;

        # NIP-05: _@roblosats.kilombino.com = the Roblosats project account,
        # kilobot@roblosats.kilombino.com = the Kilobot coordinator key (signs orders).
        location = /.well-known/nostr.json {
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=3600" always;
            return 200 '{"names":{"_":"1be1d5c217c2d4e165bfdd5c68d6c9642d2ef54d5463d85fc651e12e2dc7ebef","roblosats":"1be1d5c217c2d4e165bfdd5c68d6c9642d2ef54d5463d85fc651e12e2dc7ebef","kilobot":"67c0fa4b4ec75abc5139fe6362cdc88f29e8e565d5212284612f0fbcc0cd7f1b"},"relays":{"1be1d5c217c2d4e165bfdd5c68d6c9642d2ef54d5463d85fc651e12e2dc7ebef":["wss://relay.kilombino.com"],"67c0fa4b4ec75abc5139fe6362cdc88f29e8e565d5212284612f0fbcc0cd7f1b":["wss://relay.kilombino.com"]}}';
        }

        location = /favicon.ico {
            alias /usr/src/web/static/assets/images/favicon-96x96.png;
        }
    }
}