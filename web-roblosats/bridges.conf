# Bridges to coordinators that only have an onion: the browser on clearnet talks to
# roblosats.kilombino.com/mainnet/<alias>/, and this server reaches the onion over Tor
# (socat container on 127.0.0.1:91xx → Tor SOCKS). The coordinator sees an onion request.
location /mainnet/marcanotrades/ {
    proxy_pass http://127.0.0.1:9101/;
    proxy_http_version 1.1;
    proxy_set_header Host olwrnvnukon2lkgqmbdtjfm3vqzadhbtbjmi4abillzjmhwfhhp3mryd.onion;
    proxy_set_header Origin http://olwrnvnukon2lkgqmbdtjfm3vqzadhbtbjmi4abillzjmhwfhhp3mryd.onion;
    proxy_set_header Referer "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
}
